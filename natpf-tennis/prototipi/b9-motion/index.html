<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo B9 · gesti illustrati</title>
<style>
  @font-face { font-family: "Barlow Condensed"; font-weight: 800; font-style: italic; font-display: swap; src: url("../../fonts/barlow-condensed-latin-800-italic.woff2") format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 600; font-style: normal; font-display: swap; src: url("../../fonts/barlow-condensed-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Barlow"; font-weight: 500; font-style: normal; font-display: swap; src: url("../../fonts/barlow-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Barlow"; font-weight: 700; font-style: normal; font-display: swap; src: url("../../fonts/barlow-latin-700-normal.woff2") format("woff2"); }
  :root { --ink-950: #050a1c; --ink-900: #0a1330; --ink-700: #182a5f; --panel-solid: #0d1838; --line: rgba(176,194,255,.16);
    --line-strong: rgba(176,194,255,.34); --text: #f4f6fc; --text-2: #b6c1e0; --ball: #e3ff36; --ball-ink: #0a1330;
    --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; --font-text: "Barlow", system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; background: var(--ink-950); color: var(--text); font-family: var(--font-text); }
  /* come il gioco: misure legate all'area del gioco (container natpf), non alla finestra */
  .screen { position: fixed; inset: 0; container-type: size; container-name: natpf; overflow: hidden;
    background: radial-gradient(120% 90% at 30% 20%, #16306e 0%, #0a1330 45%, #050a1c 100%); }
  /* velo semplice, senza backdrop-filter: una sfocatura dietro un canvas ridisegnato a ogni fotogramma costa un terzo del
     fotogramma senza GPU (39 → 60 fotogrammi/s misurati nel prototipo) */
  .screen::before { content: ""; position: absolute; inset: 0; background: rgba(4, 8, 24, .62); }
  /* modale più piccola e centrata, proporzionata allo schermo */
  .card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(64cqw, 104cqh); display: grid; gap: 1.2cqh; padding: 2cqh 1.8cqw 1.6cqh; box-sizing: border-box;
    border-radius: clamp(14px, 1.6cqw, 26px); background: var(--panel-solid); border: 1px solid var(--line-strong);
    box-shadow: 0 2cqh 6cqh rgba(2, 6, 22, .55); }
  @container natpf (max-aspect-ratio: 1/1) { .card { width: 92cqw; } }
  .head { display: flex; align-items: baseline; gap: 1.2cqw; }
  .kicker { font: 700 clamp(10px, 1.1cqw, 18px)/1 var(--font-text); letter-spacing: .14em; text-transform: uppercase; color: var(--ball); }
  .name { margin: 0; font: italic 800 clamp(22px, 3cqw, 52px)/1 var(--font-display); text-transform: uppercase; }
  .tools { margin-left: auto; display: flex; gap: .6cqw; }
  .tools button { font: 700 clamp(10px, 1cqw, 16px)/1 var(--font-text); padding: .5em .9em; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line-strong); background: transparent; color: var(--text-2); }
  .stage { position: relative; aspect-ratio: 16 / 9; border-radius: clamp(10px, 1.1cqw, 18px); overflow: hidden;
    background: radial-gradient(70% 80% at 50% 42%, #1d3474 0%, #0e1c45 55%, #070d24 100%); }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .cue { margin: 0; min-height: 2.6em; font: 500 clamp(13px, 1.45cqw, 26px)/1.3 var(--font-text); color: var(--text); text-align: center; }
  .foot { display: grid; grid-template-columns: auto 1fr auto; align-items: center; }
  .nav { width: clamp(38px, 3.6cqw, 64px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
    border: 1px solid var(--line-strong); background: rgba(255,255,255,.04); color: var(--text); }
  .nav.next { background: var(--ball); border-color: var(--ball); color: var(--ball-ink); }
  .nav svg { width: 46%; height: 46%; }
  .nav:disabled { opacity: .3; cursor: default; }
  .dots { display: flex; justify-content: center; gap: .7cqw; }
  .dots i { width: clamp(6px, .6cqw, 11px); aspect-ratio: 1; border-radius: 50%; background: var(--line-strong); }
  .dots i.seen { background: var(--text-2); }
  .dots i.on { background: var(--ball); transform: scale(1.35); }
</style>
</head>
<body>
<div class="screen">
  <section class="card" role="dialog" aria-label="Tutorial dei gesti">
    <div class="head">
      <span class="kicker" id="kicker">Tutorial · 1 di 6</span>
      <h2 class="name" id="name">Presa</h2>
      <div class="tools">
        <button type="button" id="hand" aria-label="Mano">Destro</button>
        <button type="button" id="rate" aria-label="Velocità">Lento e reale</button>
      </div>
    </div>
    <div class="stage"><canvas id="cv"></canvas></div>
    <p class="cue" id="cue"></p>
    <div class="foot">
      <button type="button" class="nav prev" id="prev" aria-label="Indietro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="dots" id="dots"></div>
      <button type="button" class="nav next" id="next" aria-label="Avanti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </section>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
