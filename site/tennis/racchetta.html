<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#071233">
<title>NATPF Simulator · controller smartphone</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ff3d8b'/%3E%3Ccircle cx='44' cy='20' r='9' fill='%23e8ff3a'/%3E%3C/svg%3E">
<style>
  :root{--bg:#071233;--panel:#13245a;--ink:#f3f6fb;--muted:#a6b6dc;--ball:#e8ff3a;--ok:#4cff8a;--warn:#ffc04d;--bad:#ff6b5e;--pink:#ff3d8b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 30%,#12286e,#071233 70%);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:auto;
    -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
  body{display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
  .hidden{display:none!important}
  #bar{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;min-height:28px}
  #bar i{width:10px;height:10px;border-radius:50%;background:var(--warn);flex:none}
  #bar.ok i{background:var(--ok)} #bar.bad i{background:var(--bad)}
  #bar small{margin-left:auto;color:var(--muted);font-weight:500}
  #stage{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:8px 4px}
  #ring{position:relative;width:min(64vw,270px);aspect-ratio:1;border-radius:50%;border:7px solid #2a4590;display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:border-color .15s,transform .1s;background:radial-gradient(circle at 50% 40%,#1c3580,#0d1b4a)}
  #ring.ready{border-color:var(--ok)} #ring.hit{transform:scale(1.06);border-color:var(--ball)} #ring.miss{border-color:var(--bad)}
  #arrow{font-size:64px;line-height:1;font-weight:800;color:var(--ball);min-height:0}
  #big{font-size:30px;font-weight:800;line-height:1.1;padding:0 14px}
  #sub{font-size:17px;color:var(--muted);line-height:1.4;max-width:340px;min-height:48px}
  #grip{width:120px;height:auto}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:17px;font:inherit;font-size:19px;font-weight:700;background:var(--ball);color:#0b1433;margin-top:10px}
  .btn.alt{background:var(--panel);color:var(--ink);font-weight:600;font-size:16px;padding:14px}
  #tools{display:flex;gap:8px;margin-top:10px}
  #tools .btn{flex:1;margin:0}
  #profileOptions{font-size:15px;background:#13245a;border-radius:12px;padding:12px;display:grid;gap:8px;margin-top:10px}
  #profileOptions label{display:flex;align-items:center;justify-content:space-between;gap:8px}
  select{font:inherit;min-height:44px;max-width:58%;border-radius:8px;padding:4px;background:#eef3ff;color:#071233}
  #shotChoices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
  #shotChoices button{min-height:44px;border:1px solid #405b9b;border-radius:9px;background:#13245a;color:white;font:inherit;font-size:14px}
  #shotChoices button.on{background:#e8ff3a;color:#071233;font-weight:700}
  #shotHint,#phaseFeedback{font-size:14px;color:var(--muted);text-align:center;margin:6px 0}
  #manualAim{display:grid;gap:8px} #manualAim label:first-child{display:flex;align-items:center;justify-content:space-between}
  #power{width:100%;min-height:36px} #touchHit{touch-action:none}
  #rotate{position:fixed;inset:0;z-index:20;background:#071233;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:30px;font-size:24px}
  @media(max-height:740px){#ring{width:min(54vw,170px)}#big{font-size:19px}#arrow{font-size:42px}#stage{gap:6px;min-height:170px}#grip{width:70px}#sub{font-size:15px;min-height:0}.btn{padding:12px}}
</style>
</head>
<body>
<div id="bar"><i></i><span id="barTxt">Collegamento…</span><small id="lat"></small></div>
<div id="stage">
  <div id="ring"><div id="arrow"></div><div id="big">NATPF</div></div>
  <!-- impugnatura: telefono in verticale nel palmo, come il manico -->
  <svg id="grip" class="hidden" viewBox="0 0 120 150" aria-label="Telefono in verticale nel palmo, come il manico di una racchetta">
    <rect x="44" y="8" width="34" height="70" rx="7" fill="#dfe6ff" stroke="#0b1433" stroke-width="3"/>
    <rect x="49" y="15" width="24" height="54" rx="3" fill="#2f6bff"/>
    <path d="M30 70 q0 -14 14 -12 l40 2 q12 1 10 16 l-4 46 q-2 14 -18 14 h-22 q-18 0 -20 -18z" fill="#f0c7a0" stroke="#0b1433" stroke-width="3"/>
    <path d="M44 74 h40 M44 86 h40 M44 98 h38" stroke="#c99a74" stroke-width="3"/>
  </svg>
  <div id="sub">Mi collego al gioco sul computer…</div>
</div>
<div id="phaseFeedback" aria-live="polite"></div>
<div id="profileOptions" class="hidden">
  <label>Movimento <select id="motionRange"><option value="standard">Naturale</option><option value="compact">Corto / compatto</option></select></label>
  <label>Mano <select id="hand"><option value="right">Destra</option><option value="left">Sinistra</option></select></label>
  <label><span>Arma lo swing con un tocco</span><input id="intentGate" type="checkbox"></label>
  <small>Usa gesti comodi per te, anche da seduto. Non serve la massima forza.</small>
</div>
<div id="shotPanel" class="hidden">
  <div id="shotChoices"></div><div id="shotHint">Smash su palla alta; servizio durante il lancio.</div>
  <div id="manualAim" class="hidden"><label>Direzione <select id="aimDir"><option value="1">← Sinistra</option><option value="0">Centro</option><option value="-1">Destra →</option></select></label>
  <label for="power">Intensità <output id="powerLabel">65%</output></label><input id="power" type="range" min="30" max="100" value="65"></div>
  <button class="btn" id="touchHit">Colpisci</button>
</div>
<div id="actions">
  <button class="btn hidden" id="enable">Attiva i sensori</button>
  <button class="btn alt hidden" id="enableTouch">Gioca con i tocchi</button>
  <button class="btn hidden" id="retry">Riprova</button>
</div>
<div id="tools" class="hidden">
  <button class="btn alt" id="recal">Ricalibra</button>
  <button class="btn alt" id="bye">Scollega</button>
</div>
<div id="rotate" class="hidden" role="alert"><b>Ruota il telefono in verticale</b><p>I comandi riprendono quando torni in portrait.</p></div>
<script type="module" src="../js/tennis/racchetta.js"></script>
</body>
</html>
