name: NATPF eseguibili Windows

# Eseguibili Windows di NATPF Simulator (natpf-desktop: installabile e portatile) costruiti su GitHub e pubblicati come
# un unico file da scaricare (richiesta dell'utente del 05/11/2026: «non puoi caricarli come zip su github? in un unico
# file che scaricherò poi da lì?»; dal messaggio gli .exe da ~125 MB non si scaricavano). Il file si scarica dalla
# pagina dell'esecuzione: Actions → «NATPF eseguibili Windows» → ultima esecuzione → Artifacts. Contiene i due .exe,
# SHA256SUMS.txt e la lista dei controlli (COLLAUDO_WINDOWS.md).
# Parte quando cambia la versione del gioco (pacchetti nuovi), il programma Windows o questo file; anche a mano.
on:
  push:
    branches:
      - natpf-simulator
    paths:
      - 'site/js/tennis/version.js'
      - 'natpf-desktop/**'
      - '.github/workflows/natpf-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    name: Installabile e portatile (.exe)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Versione del gioco
        id: v
        run: |
          build=$(grep -oE "[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+" site/js/tennis/version.js | head -1)
          test -n "$build"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Versione $build"
      - name: Gioco (dipendenze e build di produzione)
        working-directory: natpf-tennis
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Server LAN (dipendenze)
        run: npm ci --prefix tools/lan --no-audit --no-fund
      - name: Programma Windows (dipendenze e prove)
        working-directory: natpf-desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci --no-audit --no-fund
          npm test
      # electron-builder scarica Electron per Windows x64; makensis (NSIS 3.0.4.1, versione Linux) compila
      # installazione e portatile senza wine (natpf-desktop/scripts/costruisci.mjs)
      - name: Costruzione degli eseguibili
        working-directory: natpf-desktop
        run: npm run costruisci
      - name: Controlli e sha256
        working-directory: natpf-desktop/dist
        run: |
          build='${{ steps.v.outputs.build }}'
          for f in "NATPF-Simulator-Setup-$build.exe" "NATPF-Simulator-Portatile-$build.exe"; do
            test -s "$f"
            test "$(stat -c %s "$f")" -gt 50000000
          done
          sha256sum NATPF-Simulator-*.exe | tee SHA256SUMS.txt
          cp ../../docs/COLLAUDO_WINDOWS.md .
          ls -l
      - name: Un unico file da scaricare
        uses: actions/upload-artifact@v4
        with:
          name: NATPF-Simulator-Windows-${{ steps.v.outputs.build }}
          path: |
            natpf-desktop/dist/NATPF-Simulator-*.exe
            natpf-desktop/dist/SHA256SUMS.txt
            natpf-desktop/dist/COLLAUDO_WINDOWS.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
