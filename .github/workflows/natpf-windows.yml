name: NATPF eseguibili Windows

# Installer Windows di NATPF Simulator (natpf-desktop) costruito su GitHub e pubblicato:
# - come Artifact dell'esecuzione (un unico file da scaricare: Actions → «NATPF eseguibili Windows» → ultima
#   esecuzione → Artifacts; richiesta del 05/11/2026), con SHA256SUMS.txt e COLLAUDO_WINDOWS.md;
# - sul bucket pubblico di Cloudflare R2 degli aggiornamenti (richiesta del 07/11/2026: «un unico installer che poi
#   deve potersi aggiornare direttamente dal gioco»; il repository è privato, quindi niente download da GitHub per il
#   programma): windows/NATPF-Simulator-Setup-<versione>.exe, poi windows/latest.json (il manifesto che il programma
#   legge), più una copia con il nome fisso windows/NATPF-Simulator-Setup.exe per la prima installazione;
#   e media/trailer-<impronta>.mp4, il trailer dell'intro per il gioco sul web (B21: natpf-desktop/media/, nello zip
#   Cloudflare non entra; nel programma Windows è dentro l'installer). Se il caricamento del trailer fallisce
#   l'installer si pubblica lo stesso (avviso).
#   Solo con i segreti del repository R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID, R2_BUCKET (guida:
#   docs/GUIDA_AGGIORNAMENTI_R2.md); senza segreti il passo si salta con un avviso e resta l'Artifact.
# L'indirizzo pubblico del bucket che il programma usa viene da natpf-desktop/aggiornamenti.json o dalla variabile del
# repository NATPF_AGGIORNAMENTI_URL (Settings → Secrets and variables → Actions → Variables).
# Parte quando cambia la versione del gioco, il programma Windows (non i soli documenti) o questo file; anche a mano.
# Sul bucket si pubblica solo una versione più nuova di quella che c'è: un installer già pubblicato non si riscrive mai
# (la costruzione non dà gli stessi byte e il nome con la versione ha la cache lunga).
on:
  push:
    branches:
      - natpf-simulator
    paths:
      - 'site/js/tennis/version.js'
      - 'natpf-desktop/**'
      - '!natpf-desktop/**/*.md'
      - '.github/workflows/natpf-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

# una pubblicazione alla volta: il manifesto non deve mai tornare a una versione vecchia
concurrency:
  group: natpf-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-exe:
    name: Installer (.exe) e aggiornamenti
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Versione del gioco
        id: v
        run: |
          build=$(grep -oE "[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+" site/js/tennis/version.js | head -1)
          test -n "$build"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Versione $build"
      - name: Gioco (dipendenze e build di produzione)
        working-directory: natpf-tennis
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Server LAN (dipendenze)
        run: npm ci --prefix tools/lan --no-audit --no-fund
      - name: Programma Windows (dipendenze e prove)
        working-directory: natpf-desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci --no-audit --no-fund
          npm test
      # electron-builder scarica Electron per Windows x64; makensis (NSIS 3.0.4.1, versione Linux) compila
      # l'installer senza wine (natpf-desktop/scripts/costruisci.mjs)
      - name: Costruzione dell'installer
        working-directory: natpf-desktop
        env:
          NATPF_AGGIORNAMENTI_URL: ${{ vars.NATPF_AGGIORNAMENTI_URL }}
        run: npm run costruisci
      - name: Controlli, sha256 e manifesto degli aggiornamenti
        working-directory: natpf-desktop/dist
        run: |
          build='${{ steps.v.outputs.build }}'
          f="NATPF-Simulator-Setup-$build.exe"
          test -s "$f"
          test "$(stat -c %s "$f")" -gt 50000000
          sha256sum NATPF-Simulator-*.exe | tee SHA256SUMS.txt
          node ../scripts/manifesto.mjs --exe="$f" --out=latest.json --novita=../novita.txt
          cp ../../docs/COLLAUDO_WINDOWS.md .
          ls -l
      - name: Un unico file da scaricare (copia di riserva su GitHub)
        # Non blocca la pubblicazione: se la quota degli artifact di GitHub è piena
        # (successo il 10/11 con 124 MB a versione) l'installer va comunque su R2.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: NATPF-Simulator-Windows-${{ steps.v.outputs.build }}
          path: |
            natpf-desktop/dist/NATPF-Simulator-*.exe
            natpf-desktop/dist/SHA256SUMS.txt
            natpf-desktop/dist/latest.json
            natpf-desktop/dist/COLLAUDO_WINDOWS.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
      - name: Segreti di Cloudflare R2
        id: r2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_BUCKET" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Aggiornamenti non pubblicati::Mancano i segreti R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID o R2_BUCKET (docs/GUIDA_AGGIORNAMENTI_R2.md): l'installer è solo negli Artifacts."
          fi
      # API S3 di R2 con aws cli (già sui runner; caricamento a più parti per i file grandi). I controlli di integrità
      # predefiniti delle versioni recenti di aws cli si limitano a quando servono (compatibilità con R2)
      - name: Pubblicazione su Cloudflare R2 (prima l'installer, poi il manifesto)
        id: pub
        if: steps.r2.outputs.ok == 'true' && github.ref == 'refs/heads/natpf-simulator'
        working-directory: natpf-desktop/dist
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          build='${{ steps.v.outputs.build }}'
          exe="NATPF-Simulator-Setup-$build.exe"
          # Account ID e nome del bucket ripuliti (spazi, a capo, virgolette, indirizzo intero copiato al posto dell'ID);
          # i messaggi dicono cosa non va senza mostrare i valori
          raw="$(printf '%s' "$R2_ACCOUNT_ID" | tr -d '[:space:]"'"'"'')"
          acct="$(printf '%s' "$raw" | tr 'A-F' 'a-f' | grep -oE '[0-9a-f]{32}' | head -n 1 || true)"
          if [ -z "$acct" ]; then
            echo "::error title=R2_ACCOUNT_ID non valido::Il segreto R2_ACCOUNT_ID non contiene un Account ID di Cloudflare (32 caratteri 0-9 e a-f): ha ${#raw} caratteri. Si trova nell'indirizzo della dashboard dopo dash.cloudflare.com/ (docs/GUIDA_AGGIORNAMENTI_R2.md)."
            exit 1
          fi
          [ "$acct" = "$raw" ] || echo "::notice title=R2_ACCOUNT_ID ripulito::Il segreto conteneva altro oltre all'Account ID (${#raw} caratteri): uso i 32 caratteri dell'ID."
          R2_BUCKET="$(printf '%s' "$R2_BUCKET" | tr -d '[:space:]"'"'"'' | sed -E 's#^s3://##; s#/.*$##')"
          ep="https://${acct}.r2.cloudflarestorage.com"
          if ! getent hosts "${acct}.r2.cloudflarestorage.com" >/dev/null; then
            echo "::error title=Endpoint R2 non trovato::L'indirizzo <Account ID>.r2.cloudflarestorage.com non esiste: l'ID nel segreto R2_ACCOUNT_ID non è quello dell'account con il bucket (o R2 non è attivo)."
            exit 1
          fi
          # chiavi ripulite (spazi, a capo, virgolette copiati insieme) e prova d'accesso al bucket con il motivo esatto,
          # senza mostrare i valori (di solito l'Access Key ID ha 32 caratteri e la Secret Access Key 64)
          AWS_ACCESS_KEY_ID="$(printf '%s' "$AWS_ACCESS_KEY_ID" | tr -d '[:space:]"'"'"'')"
          AWS_SECRET_ACCESS_KEY="$(printf '%s' "$AWS_SECRET_ACCESS_KEY" | tr -d '[:space:]"'"'"'')"
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
          lens="R2_ACCESS_KEY_ID ${#AWS_ACCESS_KEY_ID} caratteri, R2_SECRET_ACCESS_KEY ${#AWS_SECRET_ACCESS_KEY} (di solito 32 e 64)"
          [ "${#AWS_ACCESS_KEY_ID}" -gt "${#AWS_SECRET_ACCESS_KEY}" ] && lens="$lens: sembrano SCAMBIATI"
          # bucket nella giurisdizione UE (creato con «European Union»): stesso account, endpoint <id>.eu.r2.cloudflarestorage.com
          if ! prova=$(aws s3api list-objects-v2 --endpoint-url "$ep" --bucket "$R2_BUCKET" --max-items 1 2>&1) \
             && aws s3api list-objects-v2 --endpoint-url "https://${acct}.eu.r2.cloudflarestorage.com" --bucket "$R2_BUCKET" --max-items 1 >/dev/null 2>&1; then
            ep="https://${acct}.eu.r2.cloudflarestorage.com"
            echo "::notice title=Bucket R2 nella giurisdizione UE::Uso l'endpoint <Account ID>.eu.r2.cloudflarestorage.com."
            prova=""
          fi
          if [ -n "$prova" ] && ! aws s3api list-objects-v2 --endpoint-url "$ep" --bucket "$R2_BUCKET" --max-items 1 >/dev/null 2>&1; then
            case "$prova" in
              *InvalidAccessKeyId*|*InvalidArgument*) why="R2_ACCESS_KEY_ID non è l'Access Key ID di un token R2 di questo account";;
              *SignatureDoesNotMatch*) why="R2_SECRET_ACCESS_KEY non è la Secret Access Key dello stesso token";;
              *NoSuchBucket*) why="R2_BUCKET non è il nome di un bucket di questo account (${#R2_BUCKET} caratteri)";;
              *AccessDenied*|*Forbidden*|*403*) why="il token non ha il permesso Object Read & Write su questo bucket (limitato a un altro bucket, solo lettura, o di un altro account)";;
              *) why="errore non riconosciuto";;
            esac
            echo "::error title=Accesso al bucket R2 rifiutato::$why. $lens. Guida: docs/GUIDA_AGGIORNAMENTI_R2.md"
            printf '%s\n' "$prova" | sed -E 's/[0-9a-f]{32,}/<…>/g' | tail -n 3
            # diagnosi: quali operazioni passano (scrittura senza elenco = permesso sbagliato; niente con l'endpoint
            # «eu» = bucket in giurisdizione UE; niente di niente = token di un altro account o non ancora attivo)
            code(){ printf '%s' "$1" | grep -oE '\(([A-Za-z]+)\)' | head -n 1 | tr -d '()'; }
            echo "Diagnosi (senza valori):"
            echo "  Account ID: ${#acct} caratteri; bucket: ${#R2_BUCKET} caratteri"
            if r=$(aws s3api put-object --endpoint-url "$ep" --bucket "$R2_BUCKET" --key "windows/.prova-accesso" --body /dev/null 2>&1); then
              echo "  scrittura di un file di prova: OK"; aws s3api delete-object --endpoint-url "$ep" --bucket "$R2_BUCKET" --key "windows/.prova-accesso" >/dev/null 2>&1 || true
            else echo "  scrittura di un file di prova: NO ($(code "$r"))"; fi
            if r=$(aws s3api head-bucket --endpoint-url "$ep" --bucket "$R2_BUCKET" 2>&1); then echo "  bucket visibile: OK"; else echo "  bucket visibile: NO ($(printf '%s' "$r" | grep -oE '[0-9]{3}|Forbidden|Not Found' | head -n 1))"; fi
            if r=$(aws s3api list-objects-v2 --endpoint-url "https://${acct}.eu.r2.cloudflarestorage.com" --bucket "$R2_BUCKET" --max-items 1 2>&1); then
              echo "::error title=Bucket nella giurisdizione UE::Con l'endpoint .eu. il bucket risponde: va usato quello (dimmelo)."
            else echo "  endpoint UE: NO ($(code "$r"))"; fi
            if r=$(aws s3api list-buckets --endpoint-url "$ep" 2>&1); then echo "  elenco dei bucket dell'account: OK ($(printf '%s' "$r" | grep -c '"Name"') bucket)"; else echo "  elenco dei bucket dell'account: NO ($(code "$r"), normale per un token limitato a un bucket)"; fi
            exit 1
          fi
          echo "Accesso al bucket R2: ok ($lens)"
          # Trailer dell'intro (B21): natpf-desktop/media/trailer-<impronta>.mp4 → media/ sul bucket, per il gioco sul web
          # (Cloudflare), che lo scarica da lì (nel programma Windows sta dentro l'installer). Il nome porta i primi 12
          # caratteri dello sha256: se sul bucket c'è già con lo stesso peso non si ricarica (cache lunga). Si fa prima
          # del controllo «versione già pubblicata», così arriva anche quando l'installer non cambia. Un errore qui NON
          # ferma la pubblicazione dell'installer: avviso, e il gioco sul web ripiega da solo sul video di prima
          carica_trailer() {
            local f nome peso remoto
            for f in ../media/trailer-*.mp4; do
              [ -s "$f" ] || { echo "Nessun trailer in natpf-desktop/media."; return 0; }
              nome="$(basename "$f")"; peso="$(stat -c %s "$f")"
              printf '%s' "$nome" | grep -qE '^trailer-[0-9a-f]{12}\.mp4$' || { echo "Nome non valido: $nome"; return 1; }
              [ "trailer-$(sha256sum "$f" | cut -c1-12).mp4" = "$nome" ] || { echo "Il nome di $nome non corrisponde allo sha256 del file."; return 1; }
              remoto="$(aws s3api head-object --endpoint-url "$ep" --bucket "$R2_BUCKET" --key "media/$nome" --query ContentLength --output text 2>/dev/null || true)"
              if [ "$remoto" = "$peso" ]; then echo "Trailer già sul bucket: media/$nome ($peso byte), non si ricarica."; continue; fi
              aws s3 cp --endpoint-url "$ep" "$f" "s3://$R2_BUCKET/media/$nome" --only-show-errors \
                --content-type video/mp4 --cache-control "public, max-age=31536000, immutable" || return 1
              remoto="$(aws s3api head-object --endpoint-url "$ep" --bucket "$R2_BUCKET" --key "media/$nome" --query ContentLength --output text 2>/dev/null || true)"
              [ "$remoto" = "$peso" ] || { echo "Sul bucket media/$nome pesa «$remoto» byte invece di $peso."; return 1; }
              echo "Trailer caricato: media/$nome ($peso byte)"
              echo "Trailer dell'intro caricato su R2: media/$nome ($peso byte)" >> "$GITHUB_STEP_SUMMARY"
            done
          }
          if ! carica_trailer; then
            echo "::warning title=Trailer dell'intro non caricato su R2::Il video dell'intro per il gioco sul web non è sul bucket (media/): il gioco usa il video di prima. L'installer si pubblica lo stesso (docs/b21/video-e-scia.md)."
          fi
          # mai tornare indietro e mai ripubblicare la stessa versione: se sul bucket c'è già questa versione o una più
          # nuova, non si carica niente (un installer già pubblicato non si riscrive: la cache lunga del suo nome darebbe
          # i byte vecchi con lo sha256 nuovo del manifesto, e il programma rifiuterebbe il file)
          if aws s3 cp --endpoint-url "$ep" "s3://$R2_BUCKET/windows/latest.json" remoto.json --only-show-errors 2>/dev/null; then
            if ! node ../scripts/manifesto.mjs --confronta=remoto.json --build="$build"; then
              echo "::notice title=Aggiornamenti già pubblicati::Sul bucket c'è già $build o una versione più nuova: niente da caricare."
              exit 0
            fi
          fi
          # 1) installer con il nome della versione (non cambia più: cache lunga). Se c'è già (esecuzione precedente
          # interrotta prima del manifesto) non si riscrive: il manifesto si rifà dai byte che sono sul bucket
          if head=$(aws s3api head-object --endpoint-url "$ep" --bucket "$R2_BUCKET" --key "windows/$exe" 2>&1); then
            echo "::notice title=Installer già sul bucket::windows/$exe c'è già: non si ricarica, il manifesto usa quel file."
            mkdir -p bucket
            aws s3 cp --endpoint-url "$ep" "s3://$R2_BUCKET/windows/$exe" "bucket/$exe" --only-show-errors
            node ../scripts/manifesto.mjs --exe="bucket/$exe" --out=latest.json --novita=../novita.txt
            src="bucket/$exe"
          elif printf '%s' "$head" | grep -qE '404|Not Found|NoSuchKey'; then
            aws s3 cp --endpoint-url "$ep" "$exe" "s3://$R2_BUCKET/windows/$exe" --only-show-errors \
              --content-type application/vnd.microsoft.portable-executable --cache-control "public, max-age=31536000, immutable"
            src="$exe"
          else
            printf '%s\n' "$head"; exit 1
          fi
          remote_size=$(aws s3api head-object --endpoint-url "$ep" --bucket "$R2_BUCKET" --key "windows/$exe" --query ContentLength --output text)
          test "$remote_size" = "$(stat -c %s "$src")"
          test "$remote_size" = "$(node -p "require('./latest.json').size")"
          echo "Installer sul bucket: $remote_size byte"
          # 2) manifesto (solo dopo l'installer: mai un manifesto che punta a un file che non c'è), senza cache
          aws s3 cp --endpoint-url "$ep" latest.json "s3://$R2_BUCKET/windows/latest.json" --only-show-errors \
            --content-type application/json --cache-control "no-cache, max-age=0"
          # 3) copia con il nome fisso per la prima installazione (il link da dare non cambia)
          aws s3 cp --endpoint-url "$ep" "$src" "s3://$R2_BUCKET/windows/NATPF-Simulator-Setup.exe" --only-show-errors \
            --content-type application/vnd.microsoft.portable-executable --cache-control "no-cache, max-age=0"
          # 4) spazio: restano gli ultimi 5 installer con la versione nel nome (gratis fino a 10 GB)
          aws s3 ls --endpoint-url "$ep" "s3://$R2_BUCKET/windows/" | awk '{print $4}' \
            | { grep -E '^NATPF-Simulator-Setup-[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+\.exe$' || true; } | sort -V | head -n -5 \
            | while read -r old; do
                [ "$old" = "$exe" ] && continue
                echo "Tolgo $old"
                aws s3 rm --endpoint-url "$ep" "s3://$R2_BUCKET/windows/$old" --only-show-errors
              done
          echo "fatto=true" >> "$GITHUB_OUTPUT"
          echo "### Aggiornamento $build pubblicato su Cloudflare R2" >> "$GITHUB_STEP_SUMMARY"
          echo "windows/$exe e windows/latest.json (sha256 $(sha256sum "$src" | cut -d' ' -f1))" >> "$GITHUB_STEP_SUMMARY"
      # controllo dall'indirizzo pubblico, come lo vede il programma (solo se l'indirizzo è noto)
      - name: Controllo dall'indirizzo pubblico
        if: steps.pub.outputs.fatto == 'true'
        working-directory: natpf-desktop/dist
        env:
          BASE: ${{ vars.NATPF_AGGIORNAMENTI_URL }}
        run: |
          [ -n "$BASE" ] || BASE="$(node -p "require('../aggiornamenti.json').base")"
          base="${BASE%/}"
          [ -n "$base" ] || { echo "::warning title=Indirizzo pubblico mancante::natpf-desktop/aggiornamenti.json senza base"; exit 0; }
          if curl -fsS "$base/windows/latest.json?t=$(date +%s)" -o pubblico.json; then
            if [ "$(node -p "require('./pubblico.json').sha256")" = "$(node -p "require('./latest.json').sha256")" ]; then
              echo "Manifesto pubblico aggiornato: $base/windows/latest.json"
            else
              echo "::warning title=Manifesto pubblico diverso::$base/windows/latest.json non è ancora quello appena caricato (cache o altra pubblicazione)."
            fi
          else
            echo "::warning title=Manifesto pubblico non raggiungibile::$base/windows/latest.json (accesso pubblico del bucket attivo?)"
          fi
      # il trailer dell'intro come lo vede il gioco sul web (B21): indirizzo pubblico, tipo video/mp4, peso giusto.
      # L'indirizzo è quello scritto nel gioco (TRAILER.base in natpf-tennis/src/natpf/natpf_intro.js): è lì che il
      # gioco lo cerca, anche se la variabile NATPF_AGGIORNAMENTI_URL o aggiornamenti.json ne indicano un altro (in
      # quel caso un avviso in più). Solo avvisi: non ferma niente (il gioco ripiega sul video di prima)
      - name: Trailer dell'intro dall'indirizzo pubblico
        if: always() && steps.r2.outputs.ok == 'true' && github.ref == 'refs/heads/natpf-simulator'
        continue-on-error: true
        working-directory: natpf-desktop
        env:
          BASE: ${{ vars.NATPF_AGGIORNAMENTI_URL }}
        run: |
          gioco="$(sed -n "s/^ *base: '\([^']*\)'.*/\1/p" ../natpf-tennis/src/natpf/natpf_intro.js | head -n 1)"
          gioco="${gioco%/}"
          [ -n "$gioco" ] || { echo "::warning title=Indirizzo del trailer non trovato::TRAILER.base non si legge da natpf-tennis/src/natpf/natpf_intro.js"; exit 0; }
          [ -n "$BASE" ] || BASE="$(node -p "require('./aggiornamenti.json').base")"
          if [ "${BASE%/}" != "$gioco" ]; then
            echo "::warning title=Indirizzi diversi per il trailer::Il gioco cerca il trailer su $gioco (TRAILER.base in natpf_intro.js), gli aggiornamenti usano ${BASE%/}: se il bucket pubblico è cambiato va aggiornato anche natpf_intro.js."
          fi
          for f in media/trailer-*.mp4; do
            [ -s "$f" ] || { echo "Nessun trailer in natpf-desktop/media."; exit 0; }
            nome="$(basename "$f")"; peso="$(stat -c %s "$f")"
            if testa="$(curl -fsSI "$gioco/media/$nome")" \
               && printf '%s' "$testa" | grep -qiE '^content-type: *video/mp4' \
               && printf '%s' "$testa" | tr -d '\r' | grep -qiE "^content-length: *$peso\$"; then
              echo "Trailer pubblico: $gioco/media/$nome ($peso byte, video/mp4)"
            else
              echo "::warning title=Trailer dell'intro non raggiungibile::$gioco/media/$nome non risponde con video/mp4 e $peso byte: il gioco sul web usa il video di prima."
            fi
          done
