name: NATPF Simulator tests

on:
  push:
    branches:
      - natpf-simulator
      - feature/natpf-simulator-gameplay-audit
      - refactor/natpf-audit-20261015
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: 'Carica gli ZIP su GitHub (richiede spazio artifact disponibile)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    name: Node unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test rules, physics, AI and phone gesture classification
        run: node --test tools/test/*.test.mjs
      - name: Check rendering and network module syntax
        shell: bash
        run: |
          node --input-type=module --check < site/js/tennis/main.js
          node --input-type=module --check < site/js/tennis/input-time.js
          node --input-type=module --check < site/js/match/contact.js
          node --input-type=module --check < site/js/match/arcade.js
          node --input-type=module --check < site/js/tennis/scene.js
          node --input-type=module --check < site/js/tennis/character.js
          node --input-type=module --check < site/js/tennis/net.js
          node --input-type=module --check < site/js/tennis/viewpoint.js
          node --input-type=module --check < site/js/tennis/sweet-spot.js
          node --input-type=module --check < site/js/tennis/racchetta.js

  browser-smoke:
    name: Browser ${{ matrix.name }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone and timing
            command: node tools/e2e/run-local.mjs phone-only.mjs timing-browser.mjs
          - name: gesture and calibration
            command: node tools/e2e/run-local.mjs gesture-calibration.mjs
          - name: arcade visuals
            command: node tools/e2e/run-local.mjs arcade-visuals.mjs
          - name: intuitive controls
            command: |
              python3 tools/package-natpf.py --out=/tmp/natpf-scope --commit="$GITHUB_SHA"
              NATPF_SITE_ROOT=/tmp/natpf-scope/static node tools/e2e/run-local.mjs intuitive-contact.mjs quick-phone-ui.mjs phone-only.mjs
          - name: NATPF training flow
            command: CHROMIUM_PATH= node tools/e2e/natpf-training-flow.mjs
            game: true
          - name: direct LAN
            command: |
              node --test tools/lan/test/setup.test.mjs
              node tools/e2e/lan-setup-browser.mjs
              node tools/e2e/lan-browser.mjs
            lan: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install E2E dependencies
        run: npm ci --prefix tools/e2e --no-audit --no-fund
      - name: Install game dependencies (vite, for the natpf-* scripts)
        if: matrix.game
        run: npm ci --prefix natpf-tennis --no-audit --no-fund
      - name: Install LAN server dependencies
        if: matrix.lan
        run: npm ci --prefix tools/lan --no-audit --no-fund
      - name: Install Chromium and OS dependencies
        run: node tools/e2e/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Verify phone input, rendering and host/guest timing in Chromium
        run: ${{ matrix.command }}

  cloudflare-package:
    name: Validate NATPF-only packages
    runs-on: ubuntu-latest
    needs: [unit, browser-smoke]
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
      - name: Verify static entry points
        shell: bash
        run: |
          test -f site/index.html
          test -f site/tennis/index.html
          test -f site/js/tennis/main.js
          test -f site/js/tennis/scene.js
      - name: Build and verify NATPF-only ZIPs
        run: python3 tools/package-natpf.py --out=/tmp/natpf-release --commit="$GITHUB_SHA"
      - name: Upload Cloudflare Pages package when requested
        if: github.event_name == 'workflow_dispatch' && inputs.upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: natpf-simulator-cloudflare
          path: /tmp/natpf-release/natpf-simulator-cloudflare.zip
          if-no-files-found: error
          compression-level: 6
          retention-days: 1


      - name: Upload LAN package when requested
        if: github.event_name == 'workflow_dispatch' && inputs.upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: natpf-simulator-lan
          path: /tmp/natpf-release/natpf-simulator-lan.zip
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
