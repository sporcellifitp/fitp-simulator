name: NATPF Simulator tests

on:
  push:
    branches:
      - feature/natpf-simulator-gameplay-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Node unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test rules, physics, AI and phone gesture classification
        run: node --test tools/test/*.test.mjs
