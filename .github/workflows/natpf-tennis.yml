name: NATPF motore base MVP

on:
  push:
    branches:
      - natpf-simulator
      - feature/natpf-tennis-mvp
    paths:
      - 'natpf-tennis/**'
      - 'site/js/tennis/**'
      - 'site/js/match/**'
      - 'site/js/vendor/**'
      - 'site/tennis/racchetta.html'
      - 'site/assets/arena/**'
      - 'site/assets/brand/**'
      - 'site/_headers'
      - '.github/workflows/natpf-tennis.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'natpf-tennis/**'
      - 'site/js/tennis/**'
      - 'site/js/match/**'
      - 'site/js/vendor/**'
      - 'site/tennis/racchetta.html'
      - 'site/assets/arena/**'
      - 'site/assets/brand/**'
      - 'site/_headers'
      - '.github/workflows/natpf-tennis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Integration tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: natpf-tennis
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: natpf-tennis/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: NATPF ↔ motore base integration tests
        run: npm test
      # B16 (08/11): i criteri della CPU Leggenda (torneo senza grafica, 300 punti × 8 semi, ~70 s) e la non regressione di
      # casual e pro. Prima nessuno lo eseguiva e due criteri erano rimasti rotti per settimane (docs/NATPF_LEGGENDA.md)
      - name: CPU Leggenda criteria (audit:legend)
        run: npm run audit:legend
      - name: Production build (motore base 3D models, NATPF phone page and arena art)
        run: npm run build
      - name: Check bundled NATPF files
        run: |
          test -f dist/natpf/tennis/racchetta.html
          test -f dist/natpf/js/tennis/racchetta.js
          test -f dist/natpf/js/vendor/peerjs.min.js
          test -f dist/assets/arena/torino.png
          test -s dist/media/intro.mp4
          test -s dist/assets/mediapipe/hands/hands.js
          test -s dist/assets/mediapipe/hands/hands_solution_simd_wasm_bin.wasm
          test -s dist/assets/mediapipe/pose/pose_solution_simd_wasm_bin.wasm
          test -s dist/natpf/assets/brand/esports-fitp-neg.png
          test -s dist/natpf/assets/brand/nitto-atp-finals-white.png
      # B8: «la versione cloudflare deve sempre pesare leggermente meno di 25 MB». Lo script fa lo zip come per la
      # consegna e termina con errore (elencando i 10 file più pesanti) se arriva a 25.000.000 byte; il test -s
      # controlla anche che lo zip ci sia davvero (un argomento sbagliato non deve far passare il passo senza zip).
      - name: Cloudflare package under 25 MB
        run: |
          node scripts/pacchetto-cloudflare.mjs --out="$RUNNER_TEMP/natpf-cloudflare" --zip="$RUNNER_TEMP/natpf-cloudflare.zip" --turn-url=https://natpf-turn.s-porcelli.workers.dev/
          test -s "$RUNNER_TEMP/natpf-cloudflare.zip"
          test "$(stat -c %s "$RUNNER_TEMP/natpf-cloudflare.zip")" -lt 25000000
